<!DOCTYPE html>
<html>

<head>
  <title>Turkish King Online</title>

  <style>

    body {
      margin: 0;
      background: #071019;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */

    .sidebar {
      width: 320px;
      padding: 16px;
      background: #08111b;

      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel {
      background: rgba(15,25,35,.9);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.08);
    }

    .panel h3 { margin: 0 0 10px; }

    /* Gold Buttons */

    button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;

      border: none;
      border-radius: 10px;

      background: linear-gradient(
        135deg,
        #d4af37,
        #f7d774
      );

      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.05); }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 10px;

      border-radius: 10px;
      border: none;
      box-sizing: border-box;
    }

    /* Scoreboard */

    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 14px;
    }

    .score-row.active {
      background: rgba(212,175,55,.18);
      font-weight: bold;
    }

    .status {
      padding: 10px 14px;
      background: rgba(212,175,55,.12);
      border: 1px solid rgba(212,175,55,.3);
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    /* Game area */

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
    }

    /* Table */

    .table-container {
      width: 760px;
      height: 520px;

      position: relative;

      border-radius: 40px;

      background:
        radial-gradient(
          circle,
          #0f8a3d 0%,
          #0a6f32 60%,
          #065726 100%
        );

      box-shadow:
        inset 0 0 80px rgba(0,0,0,.45);
    }

    /* Avatar Seats */

    .player-seat {
      position: absolute;

      width: 120px;
      height: 120px;

      border-radius: 50%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,.25);

      border: 2px solid rgba(255,255,255,.1);
      transition: .2s;
      visibility: hidden;
    }

    .player-seat.active {
      border-color: #f7d774;
      box-shadow: 0 0 22px rgba(247,215,116,.7);
    }

    .north-player { top: 12px; left: 50%; transform: translateX(-50%); }
    .south-player { bottom: 12px; left: 50%; transform: translateX(-50%); }
    .west-player  { left: 12px; top: 50%; transform: translateY(-50%); }
    .east-player  { right: 12px; top: 50%; transform: translateY(-50%); }

    .avatar {
      width: 60px;
      height: 60px;

      border-radius: 50%;

      background: #d4af37;

      color: black;
      font-weight: bold;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seat-name {
      margin-top: 8px;
      font-size: 13px;
      text-align: center;
    }

    /* Trick area in the middle of the table */

    .trick-area {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 10px;
    }

    /* Cards */

    .card {
      width: 70px;
      height: 100px;

      background: white;
      color: black;

      border-radius: 12px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 10px;
      box-sizing: border-box;

      cursor: pointer;

      transition: .2s;
      font-weight: bold;
    }

    .card .suit { font-size: 22px; text-align: right; }

    .card:hover {
      transform: translateY(-18px);
    }

    .card.disabled {
      cursor: default;
      opacity: .8;
    }

    .card.disabled:hover { transform: none; }

    .table-card { cursor: default; }
    .table-card:hover { transform: none; }

    #hand {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 100px;
    }

  </style>

</head>

<body>

  <div class="app">

    <aside class="sidebar">

      <div class="panel">
        <h3>Player</h3>
        <input id="name" placeholder="Your name" maxlength="20">
      </div>

      <div class="panel">
        <h3>Room Info</h3>

        <div>
          Room Code:
          <strong id="room-code">---</strong>
        </div>

        <div style="margin-top:8px">
          Players:
          <strong id="player-count">0</strong> / 4
        </div>

        <button onclick="copyRoomCode()">
          Copy Invite Code
        </button>
      </div>

      <div class="panel">
        <h3>Scoreboard</h3>
        <div id="scoreboard"></div>
      </div>

      <div class="panel">
        <h3>Controls</h3>

        <button onclick="createRoom()">
          Create Room
        </button>

        <input
          id="room"
          placeholder="Room Code"
        >

        <button onclick="joinRoom()">
          Join Room
        </button>

        <button onclick="startGame()">
          Start Game
        </button>
      </div>

    </aside>

    <main class="game-area">

      <div id="status" class="status">Enter a name, then create or join a room</div>

      <div class="table-container">

        <div class="north-player player-seat">
          <div class="avatar">N</div>
          <div class="seat-name">North</div>
        </div>

        <div class="west-player player-seat">
          <div class="avatar">W</div>
          <div class="seat-name">West</div>
        </div>

        <div class="east-player player-seat">
          <div class="avatar">E</div>
          <div class="seat-name">East</div>
        </div>

        <div class="south-player player-seat">
          <div class="avatar">Y</div>
          <div class="seat-name">You</div>
        </div>

        <div id="table" class="trick-area"></div>

      </div>

      <div id="hand"></div>

    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>

</body>
</html>
