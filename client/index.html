<!DOCTYPE html>
<html>

<head>
  <title>Turkish King Online</title>

  <style>

    body {
      margin: 0;
      background: #071019;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */

    .sidebar {
      width: 320px;
      padding: 16px;
      background: #08111b;

      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: rgba(15,25,35,.9);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.08);
    }

    /* Gold Buttons */

    button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;

      border: none;
      border-radius: 10px;

      background: linear-gradient(
        135deg,
        #d4af37,
        #f7d774
      );

      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 10px;

      border-radius: 10px;
      border: none;
    }

    /* Table */

    .table-container {
      width: 1000px;
      height: 700px;

      position: relative;

      border-radius: 40px;

      background:
        radial-gradient(
          circle,
          #0f8a3d 0%,
          #0a6f32 60%,
          #065726 100%
        );

      box-shadow:
        inset 0 0 80px rgba(0,0,0,.45);
    }

    /* Avatar Seats */

    .player-seat {
      position: absolute;

      width: 120px;
      height: 120px;

      border-radius: 50%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,.25);

      border: 2px solid rgba(255,255,255,.1);
    }

    .avatar {
      width: 60px;
      height: 60px;

      border-radius: 50%;

      background: #d4af37;

      color: black;
      font-weight: bold;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seat-name {
      margin-top: 8px;
    }

    /* Cards */

    .card {
      width: 90px;
      height: 130px;

      background: white;
      color: black;

      border-radius: 12px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 10px;

      cursor: pointer;

      transition: .2s;
    }

    .card:hover {
      transform: translateY(-18px);
    }

  </style>

</head>

<body>

  <div class="app">

    <aside class="sidebar">

      <div class="panel">
        <h3>Room Info</h3>

        <div>
          Room Code:
          <strong id="room-code">---</strong>
        </div>

        <div style="margin-top:8px">
          Players:
          <strong id="player-count">0</strong>
        </div>

        <button onclick="copyRoomCode()">
          Copy Invite Code
        </button>
      </div>

      <div class="panel">
        <h3>Scoreboard</h3>

        <div>You: 0</div>
        <div>North: 0</div>
        <div>East: 0</div>
        <div>West: 0</div>
      </div>

      <div class="panel">
        <h3>Controls</h3>

        <button onclick="createRoom()">
          Create Room
        </button>

        <input
          id="room"
          placeholder="Room Code"
        >

        <button onclick="joinRoom()">
          Join Room
        </button>

        <button onclick="startGame()">
          Start Game
        </button>
      </div>

    </aside>

    <main class="game-area">

      <div class="table-container">

        <div class="north-player player-seat">
          <div class="avatar">N</div>
          <div class="seat-name">North</div>
        </div>

        <div class="west-player player-seat">
          <div class="avatar">W</div>
          <div class="seat-name">West</div>
        </div>

        <div class="east-player player-seat">
          <div class="avatar">E</div>
          <div class="seat-name">East</div>
        </div>

        <div class="south-player player-seat">
          <div class="avatar">Y</div>
          <div class="seat-name">You</div>
        </div>

        <div id="table" class="trick-area"></div>

      </div>

      <div id="hand"></div>

    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>

</body>
</html>
