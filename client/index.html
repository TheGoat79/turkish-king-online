<!DOCTYPE html><html><head><title>Turkish King Online</title><style>body{margin:0;background:#071019;color:#fff;font-family:Arial,sans-serif}.app{display:flex;height:100vh}.sidebar{width:320px;padding:16px;background:#08111b;display:flex;flex-direction:column;gap:16px}.panel{background:rgba(15,25,35,.9);border-radius:18px;padding:16px;border:1px solid rgba(255,255,255,.08)}.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.table-container{width:1000px;height:700px;border-radius:40px;position:relative;background:radial-gradient(circle,#0f8a3d 0%,#0a6f32 60%,#065726 100%);box-shadow:inset 0 0 80px rgba(0,0,0,.45)}.table-container:before{content:'';position:absolute;inset:-16px;border-radius:50px;background:linear-gradient(135deg,#6d3d1d,#8f5527,#4a2713);z-index:-1}.turn-banner{position:absolute;top:20px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:16px;background:#0d5e2f}.trick-area{position:absolute;top:180px;left:50%;transform:translateX(-50%);width:420px;height:260px;border-radius:24px;background:rgba(0,0,0,.15)}.player-seat{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.1)}.north-player{top:50px;left:50%;transform:translateX(-50%)}.west-player{left:40px;top:50%;transform:translateY(-50%)}.east-player{right:40px;top:50%;transform:translateY(-50%)}.south-player{bottom:40px;left:50%;transform:translateX(-50%)}#hand{margin-top:24px;display:flex;gap:8px}.card{width:88px;height:128px;background:#fff;color:#000;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-18px)}button,input{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:none}#chat-messages{height:120px;overflow:auto}</style></head><body><div class='app'><aside class='sidebar'><div class='panel'><h3>Room Info</h3><div id='status'></div></div><div class='panel'><h3>Players</h3><div id='players-list'>Waiting for players...</div></div><div class='panel'><h3>Game Info</h3><div id='turn'>Waiting...</div></div><div class='panel'><h3>Controls</h3><button onclick='createRoom()'>Create Room</button><input id='room' placeholder='Room code'><button onclick='joinRoom()'>Join Room</button><button onclick='startGame()'>Start Game</button></div><div class='panel'><h3>Chat</h3><div id='chat-messages'></div><input id='chat-input' placeholder='Type message...'></div></aside><main class='game-area'><div class='table-container'><div class='turn-banner'>Turkish King Online</div><div class='north-player player-seat'>North</div><div class='west-player player-seat'>West</div><div class='east-player player-seat'>East</div><div class='south-player player-seat'>You</div><div id='table' class='trick-area'></div></div><div id='hand'></div></main></div><script src='/socket.io/socket.io.js'></script><script src='app.js'></script></body></html>
